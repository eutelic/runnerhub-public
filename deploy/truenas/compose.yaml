# RunnerHub TrueNAS SCALE 24.10+ Custom App template.
# Replace the CHANGE_ME values and /mnt/POOL paths before installing.
# RunnerHub's internal credentials are generated automatically and persisted
# beneath the configured secrets path.

# Keep these four RunnerHub images on the same release/commit when pinning or
# rolling back. init-secrets intentionally reuses the bootstrap image.
x-runnerhub-images:
  control: &control-image ghcr.io/example-user/runnerhub-control:latest
  agent: &agent-image ghcr.io/example-user/runnerhub-agent:latest
  bootstrap: &bootstrap-image ghcr.io/example-user/runnerhub-bootstrap:latest
  scaleset: &scaleset-image ghcr.io/example-user/runnerhub-scaleset:latest

x-runnerhub-config:
  data-path: &data-path /mnt/POOL/runnerhub/data
  state-path: &state-path /mnt/POOL/runnerhub/agent
  secrets-path: &secrets-path /mnt/POOL/runnerhub/secrets
  github-client-id: &github-client-id Iv1.CHANGE_ME
  github-installation-id: &github-installation-id CHANGE_ME_INSTALLATION_ID
  github-url: &github-url https://github.com/OWNER/REPOSITORY
  pool-id: &pool-id pool-docker
  scaleset-name: &scaleset-name runnerhub
  max-runners: &max-runners "2"
  runner-image: &runner-image ghcr.io/actions/actions-runner:latest
  # Keep container-trusted unless workflows require Docker container actions,
  # service containers, or job containers. container-dind starts a privileged
  # per-worker Docker daemon and therefore also requires the next flag = "true".
  pool-isolation: &pool-isolation container-trusted
  allow-privileged-workers: &allow-privileged-workers "false"
  dind-image: &dind-image docker:dind

services:
  init-secrets:
    image: *bootstrap-image
    pull_policy: always
    restart: "no"
    entrypoint: ["/usr/local/bin/runnerhub-init-secrets"]
    environment:
      RUNNERHUB_SECRETS_DIR: /secrets
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /secrets/github-app.pem
    volumes:
      - type: bind
        source: *secrets-path
        target: /secrets

  control:
    image: *control-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    ports:
      - target: 8080
        published: "8787"
        protocol: tcp
    environment:
      RUNNERHUB_HTTP_ADDR: 0.0.0.0:8080
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
      RUNNERHUB_DB: /data/runnerhub.db
      RUNNERHUB_ENROLLMENT_TOKEN_FILE: /run/runnerhub-secrets/enrollment-token
      RUNNERHUB_AGENT_SECRET_FILE: /run/runnerhub-secrets/agent-secret
      RUNNERHUB_ADMIN_KEY_FILE: /run/runnerhub-secrets/admin-key
      RUNNERHUB_SCALESET_KEY_FILE: /run/runnerhub-secrets/scaleset-key
      RUNNERHUB_ALLOW_PRIVILEGED_WORKERS: *allow-privileged-workers
      RUNNERHUB_GITHUB_APP_ISSUER: *github-client-id
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /run/runnerhub-secrets/github-app.pem
      RUNNERHUB_GITHUB_API_URL: https://api.github.com
      RUNNERHUB_ALLOWED_IMAGES: *runner-image
    volumes:
      - type: bind
        source: *data-path
        target: /data
      - type: bind
        source: *secrets-path
        target: /run/runnerhub-secrets
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  agent:
    image: *agent-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      control:
        condition: service_healthy
    environment:
      RUNNERHUB_CONTROL_PLANE_URL: http://control:8080
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
      RUNNERHUB_ENROLLMENT_TOKEN_FILE: /run/runnerhub-secrets/enrollment-token
      RUNNERHUB_PROVIDER: docker
      # This must be the same absolute path inside the agent and on TrueNAS.
      # The host Docker daemon uses it when mounting per-job JIT/DinD state.
      RUNNERHUB_STATE_DIR: *state-path
      RUNNERHUB_HOST_NAME: truenas-host
      RUNNERHUB_RUNNER_IMAGE: *runner-image
      RUNNERHUB_DOCKER_PULL_POLICY: always
      RUNNERHUB_DIND_IMAGE: *dind-image
    volumes:
      # The agent is trusted infrastructure. Job containers never receive this socket.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: *state-path
        target: *state-path
      - type: bind
        source: *secrets-path
        target: /run/runnerhub-secrets
        read_only: true
    healthcheck:
      test: ["CMD", "docker", "version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  bootstrap:
    image: *bootstrap-image
    pull_policy: always
    restart: "no"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      control:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      RUNNERHUB_CONTROL_URL: http://control:8080
      RUNNERHUB_ADMIN_KEY_FILE: /run/runnerhub-secrets/admin-key
      RUNNERHUB_GITHUB_URL: *github-url
      RUNNERHUB_POOL_ID: *pool-id
      RUNNERHUB_SCALESET_NAME: *scaleset-name
      RUNNERHUB_MAX_RUNNERS: *max-runners
      RUNNERHUB_RUNNER_GROUP_ID: "1"
      RUNNERHUB_RUNNER_IMAGE: *runner-image
      RUNNERHUB_POOL_ISOLATION: *pool-isolation
      RUNNERHUB_POOL_CPU_MILLIS: "4000"
      RUNNERHUB_POOL_MEMORY_BYTES: "8589934592"
      RUNNERHUB_POOL_DISK_BYTES: "21474836480"
      RUNNERHUB_BOOTSTRAP_TIMEOUT_SECONDS: "180"
    volumes:
      - type: bind
        source: *secrets-path
        target: /run/runnerhub-secrets
        read_only: true

  scaleset:
    image: *scaleset-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      RUNNERHUB_GITHUB_URL: *github-url
      RUNNERHUB_SCALESET_NAME: *scaleset-name
      RUNNERHUB_POOL_ID: *pool-id
      RUNNERHUB_CONTROL_URL: http://control:8080
      RUNNERHUB_CONTROL_TOKEN_FILE: /run/runnerhub-secrets/scaleset-key
      RUNNERHUB_MIN_RUNNERS: "0"
      RUNNERHUB_MAX_RUNNERS: *max-runners
      RUNNERHUB_RUNNER_GROUP: ""
      RUNNERHUB_GITHUB_APP_CLIENT_ID: *github-client-id
      RUNNERHUB_GITHUB_APP_INSTALLATION_ID: *github-installation-id
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /run/runnerhub-secrets/github-app.pem
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
    volumes:
      - type: bind
        source: *secrets-path
        target: /run/runnerhub-secrets
        read_only: true
