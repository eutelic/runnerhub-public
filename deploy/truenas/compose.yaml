# RunnerHub TrueNAS SCALE 24.10+ Custom App template.
# GitHub App credentials are configured once; repositories are connected later
# from the RunnerHub dashboard after signing in with GitHub.

x-runnerhub-images:
  control: &control-image ghcr.io/eutelic/runnerhub-control:latest
  agent: &agent-image ghcr.io/eutelic/runnerhub-agent:latest
  bootstrap: &bootstrap-image ghcr.io/eutelic/runnerhub-bootstrap:latest
  scaleset: &scaleset-image ghcr.io/eutelic/runnerhub-scaleset:latest

x-runnerhub-config:
  data-path: &data-path /mnt/POOL/runnerhub/data
  state-path: &state-path /mnt/POOL/runnerhub/agent
  secrets-path: &secrets-path /mnt/POOL/runnerhub/secrets
  github-app-key-path: &github-app-key-path /mnt/POOL/runnerhub/secrets/github-app.pem
  github-client-secret-path: &github-client-secret-path /mnt/POOL/runnerhub/secrets/github-client-secret
  github-client-id: &github-client-id Iv1.CHANGE_ME
  github-app-slug: &github-app-slug CHANGE_ME_APP_SLUG
  public-url: &public-url http://TRUENAS_HOST:8787
  runner-image: &runner-image ghcr.io/actions/actions-runner:latest
  pool-isolation: &pool-isolation container-trusted
  allow-privileged-workers: &allow-privileged-workers "false"
  dind-image: &dind-image docker:dind

secrets:
  runnerhub-github-app:
    file: *github-app-key-path
  runnerhub-github-client-secret:
    file: *github-client-secret-path

services:
  init-secrets:
    image: *bootstrap-image
    pull_policy: always
    restart: "no"
    entrypoint: ["/usr/local/bin/runnerhub-init-secrets"]
    environment:
      RUNNERHUB_SECRETS_DIR: /secrets
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/runnerhub-github-app
    secrets:
      - runnerhub-github-app
    volumes:
      - type: bind
        source: *secrets-path
        target: /secrets

  control:
    image: *control-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    ports:
      - target: 8080
        published: "8787"
        protocol: tcp
    environment:
      RUNNERHUB_HTTP_ADDR: 0.0.0.0:8080
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
      RUNNERHUB_DB: /data/runnerhub.db
      RUNNERHUB_ENROLLMENT_TOKEN_FILE: /run/runnerhub-secrets/enrollment-token
      RUNNERHUB_AGENT_SECRET_FILE: /run/runnerhub-secrets/agent-secret
      RUNNERHUB_ADMIN_KEY_FILE: /run/runnerhub-secrets/admin-key
      RUNNERHUB_SCALESET_KEY_FILE: /run/runnerhub-secrets/scaleset-key
      RUNNERHUB_ALLOW_PRIVILEGED_WORKERS: *allow-privileged-workers
      RUNNERHUB_GITHUB_APP_ISSUER: *github-client-id
      RUNNERHUB_GITHUB_CLIENT_SECRET_FILE: /run/secrets/runnerhub-github-client-secret
      RUNNERHUB_GITHUB_APP_SLUG: *github-app-slug
      RUNNERHUB_PUBLIC_URL: *public-url
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/runnerhub-github-app
      RUNNERHUB_GITHUB_API_URL: https://api.github.com
      RUNNERHUB_ALLOWED_IMAGES: *runner-image
    secrets:
      - runnerhub-github-app
      - runnerhub-github-client-secret
    volumes:
      - type: bind
        source: *data-path
        target: /data
      - type: bind
        source: *secrets-path
        target: /run/runnerhub-secrets
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  agent:
    image: *agent-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      control:
        condition: service_healthy
    environment:
      RUNNERHUB_CONTROL_PLANE_URL: http://control:8080
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
      RUNNERHUB_ENROLLMENT_TOKEN_FILE: /run/runnerhub-secrets/enrollment-token
      RUNNERHUB_PROVIDER: docker
      RUNNERHUB_STATE_DIR: *state-path
      RUNNERHUB_HOST_NAME: truenas-host
      RUNNERHUB_RUNNER_IMAGE: *runner-image
      RUNNERHUB_DOCKER_PULL_POLICY: always
      RUNNERHUB_DIND_IMAGE: *dind-image
      RUNNERHUB_ALLOW_PRIVILEGED_WORKERS: *allow-privileged-workers
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: *state-path
        target: *state-path
      - type: bind
        source: *secrets-path
        target: /run/runnerhub-secrets
        read_only: true
    healthcheck:
      test: ["CMD", "docker", "version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  scaleset:
    image: *scaleset-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
      agent:
        condition: service_healthy
    labels:
      io.runnerhub.component: scaleset
    environment:
      RUNNERHUB_DYNAMIC_CONFIG: "true"
      RUNNERHUB_CONTROL_URL: http://control:8080
      RUNNERHUB_CONTROL_TOKEN_FILE: /run/runnerhub-secrets/scaleset-key
      RUNNERHUB_GITHUB_APP_CLIENT_ID: *github-client-id
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/runnerhub-github-app
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
    secrets:
      - runnerhub-github-app
    volumes:
      - type: bind
        source: *secrets-path
        target: /run/runnerhub-secrets
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/runnerhub/scaleset-ready"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 5s
