groups:
  - name: RunnerHub Configuration
    description: Configure RunnerHub
  - name: GitHub App Configuration
    description: Configure the GitHub App used by RunnerHub
  - name: Network Configuration
    description: Configure network access
  - name: Storage Configuration
    description: Configure persistent storage
  - name: Labels Configuration
    description: Configure container labels
  - name: Resources Configuration
    description: Configure service resource limits

questions:
  - variable: runnerhub
    label: ""
    group: RunnerHub Configuration
    schema:
      type: dict
      attrs:
        - variable: enable_scaleset
          label: Enable GitHub Scale-Set Listener
          description: Enable the RunnerHub scale-set listener after the control plane and Docker agent are healthy.
          schema:
            type: boolean
            default: true
        - variable: diagnostics_enabled
          label: Enable Agent Diagnostics
          description: Enable RunnerHub agent diagnostics.
          schema:
            type: boolean
            default: false


  - variable: github
    label: ""
    group: GitHub App Configuration
    schema:
      type: dict
      attrs:
        - variable: enabled
          label: Enable GitHub Integration
          description: Disable only for local evaluation or catalog smoke testing.
          schema:
            type: boolean
            default: true
        - variable: app_id
          label: GitHub App ID
          description: Numeric App ID from the GitHub App settings page.
          schema:
            type: int
            min: 1
            required: true
            show_if: [["enabled", "=", true]]
        - variable: client_id
          label: GitHub App Client ID
          schema:
            type: string
            required: true
            show_if: [["enabled", "=", true]]
        - variable: app_slug
          label: GitHub App Slug
          description: URL slug of the GitHub App, for example runnerhub-my-org.
          schema:
            type: string
            required: true
            show_if: [["enabled", "=", true]]
        - variable: client_secret
          label: GitHub App Client Secret
          schema:
            type: string
            required: true
            private: true
            max_length: 4096
            show_if: [["enabled", "=", true]]
        - variable: private_key
          label: GitHub App Private Key (PEM)
          description: Paste the complete PEM private key generated for the GitHub App.
          schema:
            type: string
            required: true
            private: true
            max_length: 65535
            show_if: [["enabled", "=", true]]
        - variable: public_url
          label: Public URL
          description: |
            Base URL users use to reach RunnerHub, without a trailing slash.
            Configure the GitHub App callback URL as <Public URL>/auth/github/callback.
          schema:
            type: string
            required: true
            show_if: [["enabled", "=", true]]

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web UI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host
                    - value: exposed
                      description: Expose only to other containers
                    - value: ""
                      description: Do not expose the port
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30559
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IP addresses on the TrueNAS host to bind. Empty binds all addresses.
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: RunnerHub Data Storage
          description: Stores the RunnerHub database and control-plane state.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: ix_volume
                      description: ixVolume managed by TrueNAS
                    - value: host_path
                      description: Existing host path
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: data
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

        - variable: agent_state
          label: Agent State Storage
          description: Stores Docker-agent state.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: ix_volume
                      description: ixVolume managed by TrueNAS
                    - value: host_path
                      description: Existing host path
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: agent-state
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

        - variable: secrets
          label: Secrets Storage
          description: Stores generated RunnerHub tokens and the materialized GitHub App credentials.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: ix_volume
                      description: ixVolume managed by TrueNAS
                    - value: host_path
                      description: Existing host path
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: secrets
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true


  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: RunnerHub containers where the label should be applied.
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: runnerhub-control
                            description: Control plane
                          - value: runnerhub-agent
                            description: Docker host agent
                          - value: runnerhub-scaleset
                            description: GitHub scale-set listener

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPU limit for each RunnerHub service container. Worker containers have their own RunnerHub pool limits.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for each RunnerHub service container. Worker containers have their own RunnerHub pool limits.
                schema:
                  type: int
                  default: 2048
                  required: true
