name: runnerhub

services:
  control:
    image: ghcr.io/example-user/runnerhub-control:${RUNNERHUB_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RUNNERHUB_HTTP_PORT:-8080}:8080"
    environment:
      RUNNERHUB_HTTP_ADDR: 0.0.0.0:8080
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
      RUNNERHUB_DB: /data/runnerhub.db
      RUNNERHUB_ENROLLMENT_TOKEN: ${RUNNERHUB_ENROLLMENT_TOKEN:?required}
      RUNNERHUB_AGENT_SECRET: ${RUNNERHUB_AGENT_SECRET:?required}
      RUNNERHUB_ADMIN_KEY: ${RUNNERHUB_ADMIN_KEY:?required}
      RUNNERHUB_SCALESET_KEY: ${RUNNERHUB_SCALESET_KEY:?required}
      RUNNERHUB_ALLOW_PRIVILEGED_WORKERS: ${RUNNERHUB_ALLOW_PRIVILEGED_WORKERS:-false}
      RUNNERHUB_GITHUB_APP_ISSUER: ${RUNNERHUB_GITHUB_APP_ISSUER:?required}
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      RUNNERHUB_GITHUB_API_URL: ${RUNNERHUB_GITHUB_API_URL:-https://api.github.com}
      RUNNERHUB_ALLOWED_IMAGES: ${RUNNERHUB_ALLOWED_IMAGES:-ghcr.io/actions/actions-runner:latest}
    secrets:
      - github_app_private_key
    volumes:
      - runnerhub-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  agent:
    image: ghcr.io/example-user/runnerhub-agent:${RUNNERHUB_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
    environment:
      RUNNERHUB_CONTROL_PLANE_URL: http://control:8080
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
      RUNNERHUB_ENROLLMENT_TOKEN: ${RUNNERHUB_ENROLLMENT_TOKEN:?required}
      RUNNERHUB_PROVIDER: docker
      RUNNERHUB_STATE_DIR: ${RUNNERHUB_STATE_DIR:-/var/lib/runnerhub}
      RUNNERHUB_HOST_NAME: ${RUNNERHUB_HOST_NAME:-docker-host}
      RUNNERHUB_RUNNER_IMAGE: ${RUNNERHUB_RUNNER_IMAGE:-ghcr.io/actions/actions-runner:latest}
      RUNNERHUB_DOCKER_PULL_POLICY: ${RUNNERHUB_DOCKER_PULL_POLICY:-always}
      RUNNERHUB_DIND_IMAGE: ${RUNNERHUB_DIND_IMAGE:-docker:dind}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${RUNNERHUB_STATE_DIR:-/var/lib/runnerhub}
        target: ${RUNNERHUB_STATE_DIR:-/var/lib/runnerhub}
    healthcheck:
      test: ["CMD", "docker", "version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  bootstrap:
    image: ghcr.io/example-user/runnerhub-bootstrap:${RUNNERHUB_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    depends_on:
      control:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      RUNNERHUB_CONTROL_URL: http://control:8080
      RUNNERHUB_ADMIN_KEY: ${RUNNERHUB_ADMIN_KEY:?required}
      RUNNERHUB_GITHUB_URL: ${RUNNERHUB_GITHUB_URL:?required}
      RUNNERHUB_POOL_ID: ${RUNNERHUB_POOL_ID:-pool-docker}
      RUNNERHUB_SCALESET_NAME: ${RUNNERHUB_SCALESET_NAME:-runnerhub}
      RUNNERHUB_MAX_RUNNERS: ${RUNNERHUB_MAX_RUNNERS:-2}
      RUNNERHUB_RUNNER_GROUP_ID: ${RUNNERHUB_RUNNER_GROUP_ID:-1}
      RUNNERHUB_RUNNER_IMAGE: ${RUNNERHUB_RUNNER_IMAGE:-ghcr.io/actions/actions-runner:latest}
      RUNNERHUB_POOL_ISOLATION: ${RUNNERHUB_POOL_ISOLATION:-container-trusted}
      RUNNERHUB_POOL_CPU_MILLIS: ${RUNNERHUB_POOL_CPU_MILLIS:-4000}
      RUNNERHUB_POOL_MEMORY_BYTES: ${RUNNERHUB_POOL_MEMORY_BYTES:-8589934592}
      RUNNERHUB_POOL_DISK_BYTES: ${RUNNERHUB_POOL_DISK_BYTES:-21474836480}
      RUNNERHUB_BOOTSTRAP_TIMEOUT_SECONDS: ${RUNNERHUB_BOOTSTRAP_TIMEOUT_SECONDS:-180}

  scaleset:
    image: ghcr.io/example-user/runnerhub-scaleset:${RUNNERHUB_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      RUNNERHUB_GITHUB_URL: ${RUNNERHUB_GITHUB_URL:?required}
      RUNNERHUB_SCALESET_NAME: ${RUNNERHUB_SCALESET_NAME:-runnerhub}
      RUNNERHUB_POOL_ID: ${RUNNERHUB_POOL_ID:-pool-docker}
      RUNNERHUB_CONTROL_URL: http://control:8080
      RUNNERHUB_CONTROL_TOKEN: ${RUNNERHUB_SCALESET_KEY:?required}
      RUNNERHUB_MIN_RUNNERS: ${RUNNERHUB_MIN_RUNNERS:-0}
      RUNNERHUB_MAX_RUNNERS: ${RUNNERHUB_MAX_RUNNERS:-2}
      RUNNERHUB_RUNNER_GROUP: ${RUNNERHUB_RUNNER_GROUP:-}
      RUNNERHUB_GITHUB_APP_CLIENT_ID: ${RUNNERHUB_GITHUB_APP_ISSUER:?required}
      RUNNERHUB_GITHUB_APP_INSTALLATION_ID: ${RUNNERHUB_GITHUB_APP_INSTALLATION_ID:?required}
      RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      RUNNERHUB_ALLOW_INSECURE_HTTP: "true"
    secrets:
      - github_app_private_key

volumes:
  runnerhub-data: {}

secrets:
  github_app_private_key:
    file: ${RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE:?required}
