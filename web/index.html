<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RunnerHub</title><style>body{font:14px system-ui;margin:0;background:#0d1117;color:#e6edf3}header{padding:18px 24px;border-bottom:1px solid #30363d}main{padding:24px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px}h1,h2{margin-top:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #30363d}input,select,button{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:8px;margin:4px}button{cursor:pointer;background:#238636}.warn{color:#d29922}</style></head><body><header><h1>RunnerHub</h1><div>GitHub Actions on compute you own</div><input id="apitoken" type="password" autocomplete="off" placeholder="API token (if enabled)"></header><main><div class="grid"><section class="card"><h2>Hosts</h2><div id="hosts"></div></section><section class="card"><h2>Pools</h2><div id="pools"></div></section><section class="card"><h2>Workers</h2><div id="workers"></div></section><section class="card"><h2>Create pool</h2><input id="pname" placeholder="linux-small"><input id="owner" placeholder="owner"><input id="repo" placeholder="repo"><input id="labels" placeholder="linux-small"><input id="image" value="ghcr.io/actions/actions-runner:latest"><input id="group" type="number" value="1"><button id="create">Create</button><pre id="msg"></pre></section></div><section class="card" style="margin-top:16px"><h2>Audit</h2><div id="audit"></div></section></main><script>const els={token:document.getElementById('apitoken'),hosts:document.getElementById('hosts'),pools:document.getElementById('pools'),workers:document.getElementById('workers'),audit:document.getElementById('audit'),msg:document.getElementById('msg')};els.token.value=sessionStorage.getItem('runnerhub-token')||'';els.token.addEventListener('input',()=>sessionStorage.setItem('runnerhub-token',els.token.value));document.getElementById('create').addEventListener('click',createPool);function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}async function j(path,opts={}){opts.headers=opts.headers||{};if(els.token.value)opts.headers.authorization='Bearer '+els.token.value;const r=await fetch(path,opts);const t=await r.text();let v;try{v=JSON.parse(t)}catch{v=t}if(!r.ok)throw new Error(typeof v==='object'?(v.detail||v.error):v);return v}function tab(rows,cols){if(!Array.isArray(rows)||!rows.length)return '<span class="warn">None</span>';return '<table><tr>'+cols.map(c=>'<th>'+esc(c[0])+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[1](r))+'</td>').join('')+'</tr>').join('')+'</table>'}async function refresh(){try{const[h,p,w,a]=await Promise.all([j('/api/v1/hosts'),j('/api/v1/pools'),j('/api/v1/workers'),j('/api/v1/audit?limit=20')]);els.hosts.innerHTML=tab(h,[['Name',x=>x.name],['State',x=>x.state],['Provider',x=>x.provider],['CPU',x=>x.capacity?.cpuMillis?`${x.capacity.cpuMillis/1000} cores`:'unknown']]);els.pools.innerHTML=tab(p,[['Name',x=>x.name],['runs-on',x=>(x.labels||[]).join(', ')],['Max',x=>x.maxConcurrency]]);els.workers.innerHTML=tab(w,[['Runner',x=>x.runnerName],['State',x=>x.state],['Host',x=>x.hostId]]);els.audit.innerHTML=tab(a,[['When',x=>x.createdAt],['Action',x=>x.action],['Result',x=>x.result],['Detail',x=>x.safeDetail||'']])}catch(e){els.msg.textContent=e.message}}async function createPool(){try{const body={name:document.getElementById('pname').value,scope:{kind:'repository',owner:document.getElementById('owner').value,repository:document.getElementById('repo').value},labels:document.getElementById('labels').value.split(',').map(x=>x.trim()).filter(Boolean),isolation:'container-trusted',resources:{cpuMillis:2000,memoryBytes:4294967296,diskBytes:0},minIdle:0,maxConcurrency:2,runnerGroupId:Number(document.getElementById('group').value),image:document.getElementById('image').value};await j('/api/v1/pools',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});els.msg.textContent='Created';refresh()}catch(e){els.msg.textContent=e.message}}refresh();setInterval(refresh,5000)</script></body></html>
