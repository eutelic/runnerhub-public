<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RunnerHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>RunnerHub</h1>
    <div>GitHub Actions on compute you own</div>
    <input id="apitoken" type="password" autocomplete="off" placeholder="API token (if enabled)">
  </header>
  <main>
    <div class="grid">
      <section class="card"><h2>Hosts</h2><div id="hosts"></div></section>
      <section class="card"><h2>Pools</h2><div id="pools"></div></section>
      <section class="card"><h2>Workers</h2><div id="workers"></div></section>
      <section class="card">
        <h2>Create pool</h2>
        <input id="pname" placeholder="linux-small">
        <input id="owner" placeholder="owner">
        <input id="repo" placeholder="repo">
        <input id="labels" placeholder="linux-small">
        <input id="image" value="ghcr.io/actions/actions-runner:latest">
        <select id="isolation" aria-label="Isolation mode">
          <option value="container-trusted">Container (no Docker actions)</option>
          <option value="container-dind">Container + private Docker daemon</option>
        </select>
        <input id="group" type="number" value="1">
        <button id="create">Create</button>
        <pre id="msg"></pre>
      </section>
    </div>
    <section class="card audit-card"><h2>Audit</h2><div id="audit"></div></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
