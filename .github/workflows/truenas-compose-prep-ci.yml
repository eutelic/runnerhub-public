name: truenas-deploy-tools-ci

on:
  pull_request:
    paths:
      - '.github/workflows/truenas-compose-prep-ci.yml'
      - 'deploy/truenas/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/truenas-compose-prep-ci.yml'
      - 'deploy/truenas/**'

concurrency:
  group: truenas-deploy-tools-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  truenas-tools:
    runs-on: runnerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate TrueNAS Compose generator
        run: bash deploy/truenas/test-prepare-compose.sh
      - name: Validate TrueNAS host preflight
        run: bash deploy/truenas/test-preflight-host.sh
      - name: Validate TrueNAS post-install verifier
        run: bash deploy/truenas/test-verify.sh
      - name: Validate TrueNAS release image preflight
        run: bash deploy/truenas/test-check-images.sh
      - name: Validate coherent image promotion verifier
        run: bash deploy/truenas/test-verify-image-set.sh
