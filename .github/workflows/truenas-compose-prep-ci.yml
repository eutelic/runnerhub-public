name: truenas-deploy-tools-ci

on:
  pull_request:
    paths:
      - '.github/workflows/truenas-compose-prep-ci.yml'
      - 'deploy/truenas/compose.yaml'
      - 'deploy/truenas/prepare-compose.sh'
      - 'deploy/truenas/test-prepare-compose.sh'
      - 'deploy/truenas/verify.sh'
      - 'deploy/truenas/test-verify.sh'
      - 'deploy/truenas/check-images.sh'
      - 'deploy/truenas/test-check-images.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/truenas-compose-prep-ci.yml'
      - 'deploy/truenas/compose.yaml'
      - 'deploy/truenas/prepare-compose.sh'
      - 'deploy/truenas/test-prepare-compose.sh'
      - 'deploy/truenas/verify.sh'
      - 'deploy/truenas/test-verify.sh'
      - 'deploy/truenas/check-images.sh'
      - 'deploy/truenas/test-check-images.sh'

permissions:
  contents: read

jobs:
  truenas-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate TrueNAS Compose generator
        run: bash deploy/truenas/test-prepare-compose.sh
      - name: Validate TrueNAS post-install verifier
        run: bash deploy/truenas/test-verify.sh
      - name: Validate TrueNAS release image preflight
        run: bash deploy/truenas/test-check-images.sh
