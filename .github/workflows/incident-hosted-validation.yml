# Target the RunnerHub pool for incident regression validation.
# Recovery when RunnerHub itself is unavailable requires an out-of-band path.
name: Incident RunnerHub validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/cireconcile/**'
      - 'scaleset/**'
      - '.github/workflows/publish-images.yml'
      - '.github/workflows/incident-hosted-validation.yml'
permissions:
  contents: read
jobs:
  affected-go-packages:
    if: github.head_ref == 'fix/github-api-backoff-listener-starts' || github.head_ref == 'fix/emergency-hosted-release-20261013' || github.head_ref == 'fix/scaleset-retry-http-transport-panic-20261013'
    runs-on: runnerhub
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.3'
          cache: true
      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/publish-images.yml
      - name: Verify Go formatting
        shell: bash
        run: |
          output="$(gofmt -l internal/cireconcile/reconcile.go internal/cireconcile/reconcile_test.go scaleset/cmd/runnerhub-scaleset/main.go scaleset/cmd/runnerhub-scaleset/main_test.go)"
          test -z "$output" || { printf 'Ungofmt files:\n%s\n' "$output"; exit 1; }
      - name: Reconciler regression tests
        run: go test ./internal/cireconcile -count=1
      - name: Scale set manager tests
        working-directory: scaleset
        run: go test ./cmd/runnerhub-scaleset -count=1
