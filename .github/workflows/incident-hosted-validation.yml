# Temporary incident-only validation while RunnerHub self-hosted listeners
# cannot accept jobs. Remove before merging once this fix is verified.
name: Incident hosted validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/cireconcile/**'
      - 'scaleset/**'
      - '.github/workflows/incident-hosted-validation.yml'
permissions:
  contents: read
jobs:
  affected-go-packages:
    if: github.head_ref == 'fix/github-api-backoff-listener-starts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: true
      - name: Verify Go formatting
        shell: bash
        run: |
          output="$(gofmt -l internal/cireconcile/reconcile.go internal/cireconcile/reconcile_test.go scaleset/cmd/runnerhub-scaleset/main.go)"
          test -z "$output" || { printf 'Ungofmt files:\n%s\n' "$output"; exit 1; }
      - name: Reconciler regression tests
        run: go test ./internal/cireconcile -count=1
      - name: Scale set manager tests
        working-directory: scaleset
        run: go test ./cmd/runnerhub-scaleset -count=1
