name: cleanup-stale-publisher-runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale-publisher-runs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-stale-publisher-runs
  cancel-in-progress: true

jobs:
  cancel-stale-runs:
    name: Cancel stale publisher backlog
    runs-on: runnerhub
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel known stale publisher-consuming runs
        shell: bash
        run: |
          set -euo pipefail

          stale_runs=(
            35352837598
            35352367814
            35352327418
            35352111116
            35352029564
            35351993952
            35351878018
            35293021719
            35293021671
            35292993773
            35292986100
            35292860702
            35292860661
            35292850952
            35292792655
            35292780839
            35292762617
          )

          for run_id in "${stale_runs[@]}"; do
            response="${RUNNER_TEMP}/cancel-${run_id}.json"
            code="$(curl -sS -o "$response" -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")"

            case "$code" in
              202)
                echo "[ cancelled ] ${run_id}"
                ;;
              409)
                echo "[ already terminal ] ${run_id}"
                ;;
              *)
                echo "Failed to cancel run ${run_id}: HTTP ${code}" >&2
                cat "$response" >&2 || true
                exit 1
                ;;
            esac
          done
