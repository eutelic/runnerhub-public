name: dind-runtime-ci

on:
  pull_request:
    paths:
      - '.github/workflows/dind-runtime-ci.yml'
      - 'cmd/runnerhub-agent/**'
      - 'internal/core/**'
      - 'internal/policy/**'
      - 'internal/provider/**'
      - 'internal/providers/docker/**'
      - 'deploy/docker/**'
      - 'deploy/truenas/**'
      - 'tests/fixtures/runner-dind-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dind-runtime-ci.yml'
      - 'cmd/runnerhub-agent/**'
      - 'internal/core/**'
      - 'internal/policy/**'
      - 'internal/provider/**'
      - 'internal/providers/docker/**'
      - 'deploy/docker/**'
      - 'deploy/truenas/**'
      - 'tests/fixtures/runner-dind-smoke.yml'
  workflow_dispatch:

concurrency:
  group: dind-runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dind-network:
    # Validate DinD on RunnerHub's isolated publisher pool.
    runs-on: runnerhub-publisher
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Verify Docker provider unit tests
        run: go test ./internal/providers/docker ./internal/policy ./internal/core

      - name: Exercise JIT mount, private DinD socket, and shared runner network
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d "$RUNNER_TEMP/runnerhub-dind.XXXXXX")"
          run_dir="$tmp/docker-run"
          jit_path="$tmp/jitconfig"
          mkdir -p "$run_dir"
          printf '%s' 'runnerhub-dind-ci-jit' >"$jit_path"

          runner_image='ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4'
          identity="$(docker run --rm --entrypoint /bin/bash "$runner_image" -lc '
            set -eu
            docker_gid="$(getent group docker | cut -d: -f3)"
            case " $(id -G runner) " in
              *" $docker_gid "*) ;;
              *) exit 1 ;;
            esac
            printf "%s:%s:%s" "$(id -u runner)" "$(id -g runner)" "$docker_gid"
          ')"
          IFS=: read -r runner_uid runner_gid docker_gid <<<"$identity"
          test -n "$runner_uid"
          test -n "$runner_gid"
          test -n "$docker_gid"
          test "$runner_gid" != "$docker_gid"
          docker run --rm \
            -v "$tmp:/state" \
            alpine:3.20 \
            chown "$runner_uid:$runner_gid" /state/jitconfig
          chmod 0400 "$jit_path"

          # Reproduce the provider's security-sensitive mount layout using the
          # actual Actions runner image/default user. The socket directory must
          # not alias the /run/runnerhub tree containing the JIT secret.
          docker run --rm \
            --mount "type=bind,src=$jit_path,dst=/run/runnerhub/jitconfig,readonly" \
            --mount "type=bind,src=$run_dir,dst=/run/runnerhub-docker" \
            "$runner_image" \
            /bin/bash -lc 'test -r /run/runnerhub/jitconfig && test -s /run/runnerhub/jitconfig && cat /run/runnerhub/jitconfig >/dev/null'

          runner="runnerhub-dind-ci-runner"
          sidecar="runnerhub-dind-ci-sidecar"

          cleanup() {
            # The DinD sidecar joins the runner network namespace, so it must
            # be removed before the runner that owns that namespace.
            docker rm -f "$sidecar" >/dev/null 2>&1 || true
            docker rm -f "$runner" >/dev/null 2>&1 || true
            # The publisher runner is ephemeral, so root-owned DinD socket
            # state can be left in RUNNER_TEMP after containers are removed.
          }
          trap cleanup EXIT

          docker run -d \
            --name "$runner" \
            --group-add "$docker_gid" \
            --mount "type=bind,src=$run_dir,dst=/run/runnerhub-docker" \
            -e DOCKER_HOST=unix:///run/runnerhub-docker/docker.sock \
            "$runner_image" \
            /bin/bash -lc 'sleep 300' >/dev/null

          runner_id="$(docker inspect "$runner" --format '{{.Id}}')"

          docker run -d \
            --name "$sidecar" \
            --privileged \
            --network "container:$runner_id" \
            --mount "type=bind,src=$run_dir,dst=/run/runnerhub-docker" \
            docker:27-dind \
            dockerd --host=unix:///run/runnerhub-docker/docker.sock --group="$docker_gid" >/dev/null

          for _ in $(seq 1 60); do
            if docker exec \
              -e DOCKER_HOST=unix:///run/runnerhub-docker/docker.sock \
              "$runner" docker info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec \
            -e DOCKER_HOST=unix:///run/runnerhub-docker/docker.sock \
            "$runner" docker info >/dev/null

          docker exec "$runner" /bin/bash -lc '
            set -eu
            socket_gid="$(stat -c %g /run/runnerhub-docker/docker.sock)"
            case " $(id -G) " in
              *" $socket_gid "*) ;;
              *) echo "runner lacks socket gid $socket_gid" >&2; exit 1 ;;
            esac
          '

          # The runner receives only the private socket directory. The host
          # Docker socket and the aliased /var/run tree are never mounted.
          mounts="$(docker inspect "$runner" --format '{{json .Mounts}}')"
          if grep -q '"Source":"/var/run/docker.sock"' <<<"$mounts"; then
            echo 'host Docker socket leaked into DinD runner' >&2
            exit 1
          fi
          if grep -q '"Destination":"/var/run"' <<<"$mounts"; then
            echo 'DinD runner still mounts the aliased /var/run tree' >&2
            exit 1
          fi
          if ! grep -q '"Destination":"/run/runnerhub-docker"' <<<"$mounts"; then
            echo 'isolated DinD socket directory is missing' >&2
            exit 1
          fi

          docker exec \
            -e DOCKER_HOST=unix:///run/runnerhub-docker/docker.sock \
            "$runner" docker run -d \
              --name runnerhub-dind-ci-redis \
              -p 6379:6379 \
              redis:7-alpine >/dev/null

          # Because the DinD daemon shares the runner network namespace, a port
          # published by the inner Docker daemon must be reachable from the
          # outer runner on localhost, matching host-style Actions services.
          docker exec "$runner" sh -c '
            for i in $(seq 1 30); do
              if nc -z 127.0.0.1 6379 >/dev/null 2>&1; then
                exit 0
              fi
              sleep 1
            done
            exit 1
          '

          docker exec \
            -e DOCKER_HOST=unix:///run/runnerhub-docker/docker.sock \
            "$runner" docker run --rm alpine:3.20 \
              sh -c 'echo RunnerHub nested container passed'

          # Verify the cleanup dependency explicitly before the trap repeats it.
          docker rm -f "$sidecar" >/dev/null
          docker rm -f "$runner" >/dev/null
