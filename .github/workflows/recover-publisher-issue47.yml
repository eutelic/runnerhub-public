name: recover-publisher-issue47

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-publisher-issue47.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: recover-publisher-issue47
  cancel-in-progress: true

jobs:
  build-fixed-images:
    name: Bootstrap fixed images through current publisher
    runs-on: runnerhub-publisher
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Verify runner can reach the private DinD daemon
        shell: bash
        run: |
          set -euo pipefail
          env DOCKER_HOST="$DOCKER_HOST" docker info >/dev/null
          env DOCKER_HOST="$DOCKER_HOST" docker buildx version

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" |             env DOCKER_HOST="$DOCKER_HOST" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Enable multi-architecture builds
        shell: bash
        run: |
          set -euo pipefail
          env DOCKER_HOST="$DOCKER_HOST" docker run --privileged --rm tonistiigi/binfmt --install all
          env DOCKER_HOST="$DOCKER_HOST" docker buildx create --name runnerhub-issue47 --driver docker-container --use
          env DOCKER_HOST="$DOCKER_HOST" docker buildx inspect --bootstrap

      - name: Build and push coherent fixed image set
        shell: bash
        env:
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for target in control agent bootstrap scaleset; do
            env DOCKER_HOST="$DOCKER_HOST" docker buildx build                 --platform linux/amd64,linux/arm64                 --build-arg VERSION="$GITHUB_SHA"                 --target "$target"                 -f deploy/docker/Dockerfile                 -t "ghcr.io/eutelic/runnerhub-$target:$SOURCE_TAG"                 --push                 .
          done

  promote-fixed-images:
    name: Promote coherent fixed image set
    needs: build-fixed-images
    runs-on: runnerhub
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      - name: Promote and verify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"

          for image in runnerhub-control runnerhub-agent runnerhub-bootstrap runnerhub-scaleset; do
            ref="ghcr.io/eutelic/$image"
            "$crane" tag "$ref:$SOURCE_TAG" latest
            source_digest="$("$crane" digest "$ref:$SOURCE_TAG")"
            latest_digest="$("$crane" digest "$ref:latest")"
            test "$source_digest" = "$latest_digest"
            echo "[ ok ] $ref:latest -> $source_digest"
          done
