name: emergency-control-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: emergency-control-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-control:
    name: Test and publish fixed control without Docker
    runs-on: runnerhub
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run scale-event regression tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/api -run 'TestScaleEventUnknown' -count=1

      - name: Build fixed linux/amd64 control binary
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_SHA}" \
              -o "${RUNNER_TEMP}/runnerhubd" \
              ./cmd/runnerhubd
          test -s "${RUNNER_TEMP}/runnerhubd"
          test -x "${RUNNER_TEMP}/runnerhubd"

      - name: Install crane and authenticate to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          crane="$(go env GOPATH)/bin/crane"
          "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"
          "$crane" version

      - name: Overlay fixed control onto current amd64 image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          image='ghcr.io/eutelic/runnerhub-control'
          fixed_amd64="${image}:emergency-amd64-${GITHUB_SHA}"
          fixed_index="${image}:emergency-${GITHUB_SHA}"

          "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"

          amd64_base_digest="$("$crane" digest --platform=linux/amd64 "${image}:latest")"
          arm64_base_digest="$("$crane" digest --platform=linux/arm64 "${image}:latest")"

          layer_root="${RUNNER_TEMP}/control-layer"
          layer_tar="${RUNNER_TEMP}/control-layer.tar"
          rootfs_tar="${RUNNER_TEMP}/control-rootfs.tar"
          extracted="${RUNNER_TEMP}/runnerhubd-extracted"

          mkdir -p "${layer_root}/usr/local/bin"
          install -m 0755 "${RUNNER_TEMP}/runnerhubd" "${layer_root}/usr/local/bin/runnerhubd"
          tar --numeric-owner --owner=0 --group=0 \
            -C "$layer_root" \
            -cf "$layer_tar" \
            usr/local/bin/runnerhubd

          "$crane" append \
            --base "${image}@${amd64_base_digest}" \
            --new_layer "$layer_tar" \
            --new_tag "$fixed_amd64"

          fixed_amd64_digest="$("$crane" digest "$fixed_amd64")"

          "$crane" export "$fixed_amd64" "$rootfs_tar"
          tar -xOf "$rootfs_tar" usr/local/bin/runnerhubd > "$extracted"
          cmp "${RUNNER_TEMP}/runnerhubd" "$extracted"

          "$crane" index append \
            --manifest "$fixed_amd64" \
            --manifest "${image}@${arm64_base_digest}" \
            --tag "$fixed_index"

          test "$("$crane" digest --platform=linux/amd64 "$fixed_index")" = "$fixed_amd64_digest"
          test "$("$crane" digest --platform=linux/arm64 "$fixed_index")" = "$arm64_base_digest"

          "$crane" copy "$fixed_index" "${image}:latest"

          source_digest="$("$crane" digest "$fixed_index")"
          latest_digest="$("$crane" digest "${image}:latest")"
          test "$source_digest" = "$latest_digest"

          printf '%s\n' "fixed amd64: $fixed_amd64_digest" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "preserved arm64: $arm64_base_digest" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "promoted index: $latest_digest" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
