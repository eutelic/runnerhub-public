name: deployment-ci

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/deployment-ci.yml'
      - '.github/workflows/publish-images.yml'
      - 'deploy/docker/**'
      - 'deploy/truenas/**'
      - 'go.mod'
      - 'go.sum'
      - 'scaleset/**'
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/deployment-ci.yml'
      - '.github/workflows/publish-images.yml'
      - 'deploy/docker/**'
      - 'deploy/truenas/**'
      - 'go.mod'
      - 'go.sum'
      - 'scaleset/**'

concurrency:
  group: deployment-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaging:
    # Docker-heavy deployment validation runs on the repository publisher pool.
    runs-on: runnerhub-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2

      - name: Validate scripts, persisted secrets, and Compose files
        run: |
          set -euo pipefail
          sh -n deploy/docker/secret-file.sh
          sh -n deploy/docker/control-entrypoint.sh
          sh -n deploy/docker/agent-entrypoint.sh
          sh -n deploy/docker/scaleset-entrypoint.sh
          sh -n deploy/docker/bootstrap-entrypoint.sh
          sh -n deploy/docker/init-secrets.sh
          bash -n deploy/docker/test-control-data-ownership.sh
          bash -n deploy/truenas/verify.sh
          bash -n deploy/truenas/verify-agent-update-attestations.sh
          bash -n deploy/truenas/test-verify-agent-update-attestations.sh

          tmp="$(mktemp -d "$RUNNER_TEMP/runnerhub-deploy.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          envfile="$tmp/runnerhub.env"
          keyfile="$tmp/github-app.pem"
          client_secret_file="$tmp/github-client-secret"
          openssl genrsa -out "$keyfile" 2048 >/dev/null 2>&1
          printf '%s\n' 'ci-github-client-secret' > "$client_secret_file"

          printf '%s\n' \
            'RUNNERHUB_ENROLLMENT_TOKEN=ci-enrollment' \
            'RUNNERHUB_AGENT_SECRET=ci-agent-secret-012345678901234567890123456789' \
            'RUNNERHUB_ADMIN_KEY=ci-admin' \
            'RUNNERHUB_SCALESET_KEY=ci-scaler' \
            'RUNNERHUB_API_KEYS=ci-admin:admin:local-admin,ci-scaler:scaler:scaleset-listener' \
            'RUNNERHUB_GITHUB_APP_ID=123456789' \
            'RUNNERHUB_GITHUB_APP_CLIENT_ID=Iv1.ci' \
            'RUNNERHUB_GITHUB_APP_INSTALLATION_ID=12345678' \
            'RUNNERHUB_GITHUB_APP_SLUG=runnerhub-ci' \
            'RUNNERHUB_PUBLIC_URL=http://127.0.0.1:8080' \
            "RUNNERHUB_GITHUB_CLIENT_SECRET_FILE=$client_secret_file" \
            "RUNNERHUB_GITHUB_APP_PRIVATE_KEY_FILE=$keyfile" \
            'RUNNERHUB_GITHUB_URL=https://github.com/acme/app' > "$envfile"

          bash deploy/docker/test-secret-init.sh

          probe="$tmp/secret-probe"
          printf 'from-file\n' > "$probe"
          RUNNERHUB_TEST_FILE="$probe" sh -c '
            set -eu
            . deploy/docker/secret-file.sh
            runnerhub_load_secret RUNNERHUB_TEST RUNNERHUB_TEST_FILE
            test "$RUNNERHUB_TEST" = "from-file"
          '
          RUNNERHUB_TEST='from-env' RUNNERHUB_TEST_FILE="$probe" sh -c '
            set -eu
            . deploy/docker/secret-file.sh
            runnerhub_load_secret RUNNERHUB_TEST RUNNERHUB_TEST_FILE
            test "$RUNNERHUB_TEST" = "from-env"
          '
          : > "$probe"
          if RUNNERHUB_TEST_FILE="$probe" sh -c '
            set -eu
            . deploy/docker/secret-file.sh
            runnerhub_load_secret RUNNERHUB_TEST RUNNERHUB_TEST_FILE
          '; then
            echo 'empty secret file unexpectedly succeeded' >&2
            exit 1
          fi

          bash deploy/truenas/test-prepare-compose.sh
          bash deploy/truenas/test-preflight-host.sh
          bash deploy/truenas/test-verify.sh
          bash deploy/truenas/test-check-images.sh
          bash deploy/truenas/test-verify-image-set.sh
          bash deploy/truenas/test-verify-agent-update-attestations.sh

          docker compose --env-file "$envfile" -f deploy/docker/compose.yaml --profile autoscale config >/dev/null
          docker compose --env-file "$envfile" -f deploy/docker/compose.release.yaml config >/dev/null
          docker compose -f deploy/truenas/compose.yaml config >/dev/null
          docker compose -f deploy/truenas/deployer.compose.yaml config >/dev/null


      - name: Validate TrueNAS Community catalog policy
        run: bash deploy/truenas/catalog/validate.sh

      - name: Provision isolated Python with pip for catalog rendering
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Render staged TrueNAS catalog with upstream tooling
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "$RUNNER_TEMP/truenas-apps.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 https://github.com/truenas/apps.git "$tmp/apps"
          cp -a deploy/truenas/catalog/ix-dev/community/runnerhub "$tmp/apps/ix-dev/community/runnerhub"
          # RunnerHub self-hosted CI may run on a TrueNAS kernel. The upstream
          # apps_validation container inherits the host uname, so ix_lib thinks
          # it runs on TrueNAS and tries the absent middleware UNIX socket even
          # though upstream explicitly sets FAKE_ENV=1 for offline rendering.
          # Change only this throwaway upstream checkout to honor FAKE_ENV and
          # use ix_lib's *existing* off-system mock; never patch production code.
          # Fail closed if upstream changes the function rather than silently
          # skipping catalog rendering.
          python3 - "$tmp/apps" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          libraries = sorted(root.glob("library/*/validations.py"))
          if not libraries:
              sys.exit("No upstream TrueNAS catalog validation libraries found")
          old = 'return "truenas" in os.uname().release'
          new = 'return os.environ.get("FAKE_ENV") != "1" and "truenas" in os.uname().release'
          for path in libraries:
              contents = path.read_text()
              if contents.count(old) != 1:
                  sys.exit(f"Unexpected TrueNAS platform detection in {path}")
              path.write_text(contents.replace(old, new, 1))
          print(f"Enabled existing off-system catalog mock in {len(libraries)} temporary libraries")
          PY
          cd "$tmp/apps"
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          for test_file in basic-values.yaml github-host-path-values.yaml; do
            echo "Rendering RunnerHub catalog scenario: $test_file"
            python3 .github/scripts/ci.py --app runnerhub --train community --test-file "$test_file" --render-only=true >/dev/null
          done
          cp ix-dev/community/runnerhub/app.yaml "$RUNNER_TEMP/runnerhub-app-before.yaml"
          python3 .github/scripts/generate_metadata.py --app runnerhub --train community
          diff -u "$RUNNER_TEMP/runnerhub-app-before.yaml" ix-dev/community/runnerhub/app.yaml
          python3 .github/scripts/port_validation.py

      - name: Build published image targets
        run: |
          set -euo pipefail
          docker build --build-arg VERSION=ci-test --target control -f deploy/docker/Dockerfile -t runnerhub-ci-control .
          docker build --build-arg VERSION=ci-test --target agent -f deploy/docker/Dockerfile -t runnerhub-ci-agent .
          docker build --build-arg VERSION=ci-test --target bootstrap -f deploy/docker/Dockerfile -t runnerhub-ci-bootstrap .
          docker build --build-arg VERSION=ci-test --target scaleset -f deploy/docker/Dockerfile -t runnerhub-ci-scaleset .
          docker build --build-arg VERSION=ci-test --target deployer -f deploy/docker/Dockerfile -t runnerhub-ci-deployer .
          docker build --build-arg VERSION=ci-test --target updater -f deploy/docker/Dockerfile -t runnerhub-ci-updater .

      - name: Verify control persistent data ownership migration
        run: |
          set -euo pipefail
          bash deploy/docker/test-control-data-ownership.sh runnerhub-ci-control

      - name: Exercise TrueNAS-style persisted control and Docker agent
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "$RUNNER_TEMP/runnerhub-deploy.XXXXXX")"
          root="$tmp/runnerhub"
          compose_file="$tmp/compose.yaml"
          project="runnerhub-truenas-ci"
          docker_socket="${DOCKER_HOST#unix://}"
          test "$docker_socket" != "$DOCKER_HOST"
          test -S "$docker_socket"
          export RUNNERHUB_DOCKER_SOCKET_PATH="$docker_socket"
          port="$(python3 - <<'PY'
          import socket
          s = socket.socket()
          s.bind(('127.0.0.1', 0))
          print(s.getsockname()[1])
          s.close()
          PY
          )"

          cleanup() {
            docker compose -p "$project" -f "$compose_file" down --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          root_read() {
            docker run --rm --user 0 --entrypoint /bin/sh -v "$root:/state:ro" runnerhub-ci-control -c 'cat "$1"' sh "/state/$1"
          }
          root_secret_hash() {
            docker run --rm --user 0 --entrypoint /bin/sh -v "$root:/state:ro" runnerhub-ci-control -c '
              sha256sum /state/secrets/enrollment-token /state/secrets/agent-secret /state/secrets/admin-key /state/secrets/scaleset-key |
                sha256sum | cut -d" " -f1
            '
          }

          mkdir -p "$root/data" "$root/agent" "$root/secrets"
          openssl genrsa -out "$root/secrets/github-app.pem" 2048 >/dev/null 2>&1
          printf '%s\n' 'ci-github-client-secret' > "$root/secrets/github-client-secret"
          chmod 0600 "$root/secrets/github-app.pem" "$root/secrets/github-client-secret"

          sed \
            -e "s|/mnt/POOL/runnerhub|$root|g" \
            -e 's|ghcr.io/eutelic/runnerhub-control:latest|runnerhub-ci-control|g' \
            -e 's|ghcr.io/eutelic/runnerhub-agent:latest|runnerhub-ci-agent|g' \
            -e 's|ghcr.io/eutelic/runnerhub-bootstrap:latest|runnerhub-ci-bootstrap|g' \
            -e 's|ghcr.io/eutelic/runnerhub-scaleset:latest|runnerhub-ci-scaleset|g' \
            -e 's|pull_policy: always|pull_policy: never|g' \
            -e 's|github-app-id: &github-app-id 123456789|github-app-id: \&github-app-id 123456789|g' \
            -e 's|Iv1.CHANGE_ME|Iv1.ci|g' \
            -e 's|CHANGE_ME_APP_SLUG|runnerhub-ci|g' \
            -e "s|http://TRUENAS_HOST:8787|http://127.0.0.1:$port|g" \
            -e "s|published: \"8787\"|published: \"$port\"|g" \
            deploy/truenas/compose.yaml > "$compose_file"

          wait_for_agent() {
            for _ in $(seq 1 60); do
              agent_id="$(docker compose -p "$project" -f "$compose_file" ps -q agent 2>/dev/null || true)"
              agent_health=""
              if [ -n "$agent_id" ]; then
                agent_health="$(docker inspect "$agent_id" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
              fi
              if [ "$agent_health" = "healthy" ] && \
                 curl --fail --silent "http://127.0.0.1:$port/healthz" >/dev/null 2>&1 && \
                 [ -s "$root/secrets/admin-key" ] && \
                 [ -s "$root/agent/agent-credentials.json" ]; then
                admin_key="$(root_read secrets/admin-key)"
                hosts="$(curl --fail --silent \
                  -H "Authorization: Bearer $admin_key" \
                  "http://127.0.0.1:$port/api/v1/hosts" 2>/dev/null || true)"
                if printf '%s' "$hosts" | python3 -c '
          import json, sys
          hosts = json.load(sys.stdin)
          assert any(h.get("provider") == "docker" and h.get("state") == "online" for h in hosts)
          ' >/dev/null 2>&1; then
                  return 0
                fi
              fi
              sleep 1
            done
            echo 'TrueNAS-style RunnerHub stack did not become ready' >&2
            docker compose -p "$project" -f "$compose_file" ps >&2 || true
            docker compose -p "$project" -f "$compose_file" logs --no-color >&2 || true
            return 1
          }

          docker compose -p "$project" -f "$compose_file" up -d init-secrets control agent
          wait_for_agent

          admin_before="$(root_read secrets/admin-key)"
          secrets_before="$(root_secret_hash)"
          host_before="$(root_read agent/agent-credentials.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["hostId"])')"

          docker compose -p "$project" -f "$compose_file" down --remove-orphans
          docker compose -p "$project" -f "$compose_file" up -d init-secrets control agent
          wait_for_agent

          test "$(root_read secrets/admin-key)" = "$admin_before"
          secrets_after="$(root_secret_hash)"
          test "$secrets_after" = "$secrets_before"
          host_after="$(root_read agent/agent-credentials.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["hostId"])')"
          test "$host_after" = "$host_before"
