name: ci
on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/actionlint.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'scaleset/**'
      - 'tests/**'
      - 'deploy/docker/**'
      - 'deploy/truenas/**'
      - 'web/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/actionlint.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'scaleset/**'
      - 'tests/**'
      - 'deploy/docker/**'
      - 'deploy/truenas/**'
      - 'web/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan deterministic CI work
    runs-on: runnerhub
    outputs:
      core: ${{ steps.changed.outputs.core }}
      minimum: ${{ steps.changed.outputs.minimum }}
      root_permission: ${{ steps.changed.outputs.root_permission }}
      core_race: ${{ steps.changed.outputs.core_race }}
      scaleset: ${{ steps.changed.outputs.scaleset }}
      agent: ${{ steps.changed.outputs.agent }}
      docker_stack: ${{ steps.changed.outputs.docker_stack }}
      reuse_core: ${{ steps.reuse.outputs.core }}
      reuse_minimum: ${{ steps.reuse.outputs.minimum }}
      reuse_scaleset: ${{ steps.reuse.outputs.scaleset }}
      reuse_agent: ${{ steps.reuse.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine affected validation lanes
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Prove reusable merged-PR validation
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const outputs = {core: false, minimum: false, scaleset: false, agent: false};
            for (const [name, value] of Object.entries(outputs)) core.setOutput(name, String(value));

            const {owner, repo} = context.repo;
            const sha = context.sha;
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {owner, repo, commit_sha: sha, per_page: 100}
            );
            const merged = associated
              .filter(pr => pr.merged_at)
              .sort((a, b) => new Date(b.merged_at) - new Date(a.merged_at))[0];
            if (!merged) {
              core.info('No merged pull request is associated with this main commit; validation will run normally.');
              return;
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id: 'ci.yml', event: 'pull_request', status: 'success', per_page: 100}
            );
            const source = runs.find(run =>
              Array.isArray(run.pull_requests) &&
              run.pull_requests.some(pr => pr.number === merged.number)
            );
            if (!source) {
              core.info('No successful pull-request CI run found for the merged PR.');
              return;
            }

            const [mainCommit, prCommit] = await Promise.all([
              github.rest.repos.getCommit({owner, repo, ref: sha}),
              github.rest.repos.getCommit({owner, repo, ref: source.head_sha}),
            ]);
            const mainTree = mainCommit.data.commit.tree.sha;
            const prTree = prCommit.data.commit.tree.sha;
            if (!mainTree || mainTree !== prTree) {
              core.info(`PR/main trees differ (${prTree || 'unknown'} != ${mainTree || 'unknown'}); validation will run normally.`);
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {owner, repo, run_id: source.id, per_page: 100}
            );
            const succeeded = name => jobs.some(job => job.name === name && job.conclusion === 'success');
            const prefixSucceeded = prefix => {
              const matches = jobs.filter(job => job.name.startsWith(prefix));
              return matches.length > 0 && matches.every(job => job.conclusion === 'success');
            };

            outputs.core = succeeded('core');
            outputs.minimum = succeeded('Minimum declared Go toolchains');
            outputs.scaleset = succeeded('scaleset');
            outputs.agent = prefixSucceeded('agent-crossbuild');
            for (const [name, value] of Object.entries(outputs)) core.setOutput(name, String(value));
            core.info(`Tree-identical PR #${merged.number} run ${source.id} provides reusable validation: ${JSON.stringify(outputs)}`);

  core:
    needs: plan
    if: needs.plan.outputs.core == 'true' && needs.plan.outputs.reuse_core != 'true'
    # Standard unprivileged CI stays on RunnerHub.
    runs-on: runnerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflow concurrency policy
        run: bash scripts/test-workflow-concurrency.sh
      - name: Validate deterministic affected-job planner
        run: bash scripts/test-ci-changes.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: go test ./...
      - run: go test -tags localtest ./tests/soak -count=1
      - run: go vet ./...
      - name: Run Go security static analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude-generated -severity high ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  minimum-toolchains:
    needs: plan
    if: needs.plan.outputs.minimum == 'true' && needs.plan.outputs.reuse_minimum != 'true'
    name: Minimum declared Go toolchains
    runs-on: runnerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test root module with declared minimum
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Test scale-set module with declared minimum
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scaleset/go.mod
          cache: false
      - run: go test ./...
        working-directory: scaleset

  root-permission-regression:
    needs: plan
    if: needs.plan.outputs.root_permission == 'true'
    # Docker-heavy validation uses RunnerHub's isolated publisher pool.
    runs-on: runnerhub-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Verify root JIT secret ownership normalization
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            golang:1.26.6 \
            bash -lc '/usr/local/go/bin/go test ./internal/providers/docker ./internal/providers/truenas -run TestWriteJITSecretNormalizesPermissions -count=1'

  core-race:
    needs: plan
    if: needs.plan.outputs.core_race == 'true'
    # Docker/CGO race validation uses RunnerHub's isolated publisher pool.
    runs-on: runnerhub-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Run race detector in toolchain container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            golang:1.26.6 \
            bash -lc '/usr/local/go/bin/go test -race ./internal/...'

  scaleset:
    needs: plan
    if: needs.plan.outputs.scaleset == 'true' && needs.plan.outputs.reuse_scaleset != 'true'
    runs-on: runnerhub
    defaults:
      run:
        working-directory: scaleset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: scaleset/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  agent-crossbuild:
    needs: plan
    if: needs.plan.outputs.agent == 'true' && needs.plan.outputs.reuse_agent != 'true'
    runs-on: runnerhub
    strategy:
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: GOOS=${{ matrix.goos }} GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/runnerhub-agent

  docker-stack-smoke:
    needs: plan
    if: needs.plan.outputs.docker_stack == 'true'
    # Docker stack validation uses RunnerHub's isolated publisher pool.
    runs-on: runnerhub-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
      - name: Boot Compose stack and enroll Docker agent
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "$RUNNER_TEMP/runnerhub-stack.XXXXXX")"
          envfile="$tmp/runnerhub.env"
          keyfile="$tmp/github-app.pem"
          project="runnerhub-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker_socket="${DOCKER_HOST#unix://}"
          test "$docker_socket" != "$DOCKER_HOST"
          test -S "$docker_socket"

          cleanup() {
            docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" --profile autoscale down -v >/dev/null 2>&1 || true
            rm -rf "$tmp" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          bash -n scripts/init-docker-env.sh
          bash -n scripts/start-docker.sh
          bash -n deploy/docker/control-entrypoint.sh
          bash -n deploy/docker/scaleset-entrypoint.sh
          bash scripts/init-docker-env.sh "$envfile"
          [ "$(stat -c '%a' "$envfile")" = "600" ]

          openssl genrsa -out "$keyfile" 2048 >/dev/null 2>&1
          sed -i 's|REPLACE_WITH_GITHUB_APP_CLIENT_ID|Iv1.ci|' "$envfile"
          sed -i 's|REPLACE_WITH_INSTALLATION_ID|12345678|' "$envfile"
          sed -i 's|https://github.com/OWNER/REPOSITORY|https://github.com/acme/app|' "$envfile"
          sed -i "s|/absolute/path/to/runnerhub-github-app.pem|$keyfile|" "$envfile"
          printf '\nRUNNERHUB_HOST_NAME=ci-docker-host\nRUNNERHUB_DOCKER_SOCKET_PATH=%s\n' "$docker_socket" >> "$envfile"
          admin_key="$(sed -n 's/^RUNNERHUB_ADMIN_KEY=//p' "$envfile")"
          scaleset_key="$(sed -n 's/^RUNNERHUB_SCALESET_KEY=//p' "$envfile")"
          test -n "$admin_key"
          test -n "$scaleset_key"
          test "$admin_key" != "$scaleset_key"
          grep -q "${scaleset_key}:scaler:scaleset-listener" "$envfile"

          docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" --profile autoscale config >/dev/null
          docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" --profile autoscale build scaleset
          docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" up -d --build control agent

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              ready=true
              break
            fi
            if [ "$(docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" ps --status exited -q control | wc -l)" -gt 0 ]; then
              echo "RunnerHub control plane exited before becoming healthy" >&2
              docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" logs control >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "RunnerHub control plane did not become healthy" >&2
            docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" logs control >&2 || true
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${scaleset_key}" \
            http://127.0.0.1:8080/api/v1/workers >/dev/null
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${scaleset_key}" \
            http://127.0.0.1:8080/api/v1/hosts)"
          test "$status" = "403"

          enrolled=false
          for attempt in $(seq 1 45); do
            hosts="$(curl --fail --silent --show-error -H "Authorization: Bearer ${admin_key}" http://127.0.0.1:8080/api/v1/hosts || true)"
            if printf '%s' "$hosts" | grep -q '"provider":"docker"' && printf '%s' "$hosts" | grep -q '"state":"online"'; then
              enrolled=true
              break
            fi
            sleep 1
          done
          if [ "$enrolled" != "true" ]; then
            echo "Docker agent did not enroll" >&2
            docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" logs control agent >&2 || true
            exit 1
          fi

          docker compose --env-file "$envfile" -f deploy/docker/compose.yaml -p "$project" exec -T control test -f /data/runnerhub.db
