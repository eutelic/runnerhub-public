name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go mod tidy
      - run: cat go.mod
      - run: go test ./...
      - run: go vet ./...
  scaleset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaleset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod tidy
      - run: cat go.mod
      - run: go test ./...
      - run: go vet ./...
