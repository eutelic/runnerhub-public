name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go test -tags localtest ./tests/soak -count=1
      - run: go vet ./...
  scaleset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaleset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: scaleset/go.sum
      - run: go test ./...
      - run: go vet ./...
