name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./internal/...
      - run: go test -tags localtest ./tests/soak -count=1
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
  scaleset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaleset
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: scaleset/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
  agent-crossbuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: GOOS=${{ matrix.goos }} GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/runnerhub-agent
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --target control -f deploy/docker/Dockerfile -t runnerhub-control:test .
      - name: Boot control plane with fresh persistent volume
        run: |
          set -euo pipefail
          volume="runnerhub-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="runnerhub-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" -p 18080:8080 -v "$volume:/data" \
            -e RUNNERHUB_HTTP_ADDR=0.0.0.0:8080 \
            -e RUNNERHUB_ALLOW_INSECURE_HTTP=true \
            -e RUNNERHUB_DB=/data/runnerhub.db \
            -e RUNNERHUB_ENROLLMENT_TOKEN=ci-enrollment-secret \
            -e RUNNERHUB_AGENT_SECRET=ci-agent-secret-that-is-more-than-32-bytes \
            runnerhub-control:test >/dev/null

          ready=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]; then
              echo "RunnerHub control plane exited before becoming healthy" >&2
              docker logs "$container" >&2 || true
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "RunnerHub control plane did not become healthy" >&2
            docker logs "$container" >&2 || true
            exit 1
          fi
          docker exec "$container" test -f /data/runnerhub.db
