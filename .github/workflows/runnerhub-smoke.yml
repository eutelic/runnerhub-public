name: RunnerHub smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: runnerhub
    timeout-minutes: 10
    steps:
      - name: Verify RunnerHub worker
        run: |
          set -euo pipefail
          printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          test -d "$RUNNER_TEMP"
          echo "RunnerHub smoke test passed"
