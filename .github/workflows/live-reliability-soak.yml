name: live-reliability-soak

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Number of real RunnerHub jobs to execute
        required: true
        type: choice
        default: '100'
        options:
          - '20'
          - '50'
          - '100'
      runner_label:
        description: RunnerHub label to exercise
        required: true
        type: string
        default: runnerhub
      max_parallel:
        description: Maximum jobs allowed to run concurrently
        required: true
        type: choice
        default: '4'
        options:
          - '1'
          - '2'
          - '4'
          - '8'
      hold_seconds:
        description: Seconds each soak job stays active after assignment
        required: true
        type: choice
        default: '5'
        options:
          - '1'
          - '5'
          - '15'
          - '30'

permissions:
  actions: read
  contents: read

concurrency:
  group: live-reliability-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan soak matrix
    runs-on: runnerhub
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      expected: ${{ steps.matrix.outputs.expected }}
    steps:
      - name: Build bounded matrix
        id: matrix
        env:
          JOB_COUNT: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          count = int(os.environ["JOB_COUNT"])
          if count not in {20, 50, 100}:
              raise SystemExit(f"unsupported soak size: {count}")
          print("matrix=" + json.dumps(list(range(1, count + 1)), separators=(",", ":")))
          print(f"expected={count}")
          PY

  soak:
    name: soak (${{ matrix.index }})
    needs: plan
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        index: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Exercise ephemeral runner
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
          SOAK_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "soak_index=$SOAK_INDEX"
          echo "runner_name=$RUNNER_NAME"
          echo "started_at=$started"
          uname -a
          sleep "$HOLD_SECONDS"
          echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  verify-cleanup:
    name: Verify RunnerHub cleanup
    if: always()
    needs: [plan, soak]
    runs-on: runnerhub
    timeout-minutes: 6
    env:
      RUNNERHUB_CONTROL_URL: ${{ secrets.RUNNERHUB_SOAK_CONTROL_URL }}
      RUNNERHUB_ADMIN_KEY: ${{ secrets.RUNNERHUB_SOAK_ADMIN_KEY }}
      EXPECTED: ${{ needs.plan.outputs.expected }}
    steps:
      - name: Verify exact-run workers become terminal
        run: |
          set -euo pipefail
          if [ -z "$RUNNERHUB_CONTROL_URL" ] || [ -z "$RUNNERHUB_ADMIN_KEY" ]; then
            {
              echo "### RunnerHub cleanup verification"
              echo
              echo "Skipped: configure RUNNERHUB_SOAK_CONTROL_URL and RUNNERHUB_SOAK_ADMIN_KEY repository secrets for control-plane cleanup verification."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          endpoint="${RUNNERHUB_CONTROL_URL%/}/api/v1/workers"
          snapshot="$RUNNER_TEMP/runnerhub-soak-workers.json"
          settled=false

          for _ in $(seq 1 60); do
            curl --fail --silent --show-error               -H "Authorization: Bearer $RUNNERHUB_ADMIN_KEY"               "$endpoint" > "$snapshot"

            result="$(RUN_ID="$GITHUB_RUN_ID" EXPECTED="$EXPECTED" python3 - "$snapshot" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              workers = json.load(fh)

          run_id = int(os.environ["RUN_ID"])
          expected = int(os.environ["EXPECTED"])
          matched = [w for w in workers if int(w.get("workflowRunId") or 0) == run_id]
          active_states = {"provisioning", "starting", "registering", "ready", "busy", "cleanup_pending", "deleting"}
          active = [w for w in matched if str(w.get("state", "")).lower() in active_states]
          failed = [w for w in matched if str(w.get("state", "")).lower() == "failed"]
          deleted = [w for w in matched if str(w.get("state", "")).lower() == "deleted"]
          print(f"{len(matched)} {len(active)} {len(failed)} {len(deleted)} {expected}")
          PY
          )"

            read -r matched active failed deleted expected <<< "$result"
            if [ "$matched" -ge "$expected" ] && [ "$active" -eq 0 ]; then
              settled=true
              break
            fi
            sleep 2
          done

          {
            echo "### RunnerHub cleanup verification"
            echo
            echo "- expected jobs: $expected"
            echo "- matched workers: $matched"
            echo "- deleted workers: $deleted"
            echo "- failed workers: $failed"
            echo "- still active after settling window: $active"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$settled" != "true" ]; then
            echo "RunnerHub workers for workflow run $GITHUB_RUN_ID did not settle before timeout" >&2
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "$failed RunnerHub workers ended failed during the soak" >&2
            exit 1
          fi

  summarize:
    name: Summarize live soak
    if: always()
    needs: [plan, soak, verify-cleanup]
    runs-on: runnerhub
    timeout-minutes: 5
    steps:
      - name: Summarize GitHub job evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
          CLEANUP_RESULT: ${{ needs.verify-cleanup.result }}
        with:
          script: |
            const expected = Number(process.env.EXPECTED || 0);
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );

            const soak = jobs.filter(job => /^soak \(\d+\)$/.test(job.name));
            const success = soak.filter(job => job.conclusion === 'success');
            const failed = soak.filter(job => job.conclusion && job.conclusion !== 'success');
            const runners = [...new Set(soak.map(job => job.runner_name).filter(Boolean))].sort();

            const durations = soak
              .filter(job => job.started_at && job.completed_at)
              .map(job => (new Date(job.completed_at) - new Date(job.started_at)) / 1000)
              .filter(seconds => Number.isFinite(seconds) && seconds >= 0)
              .sort((a, b) => a - b);

            const percentile = p => {
              if (!durations.length) return null;
              const index = Math.min(durations.length - 1, Math.ceil(p * durations.length) - 1);
              return durations[index];
            };

            await core.summary
              .addHeading('RunnerHub live reliability soak')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Expected jobs', String(expected)],
                ['Observed soak jobs', String(soak.length)],
                ['Successful jobs', String(success.length)],
                ['Non-success jobs', String(failed.length)],
                ['Distinct runner names', String(runners.length)],
                ['Job runtime p50', percentile(0.50) === null ? 'n/a' : percentile(0.50).toFixed(1) + 's'],
                ['Job runtime p95', percentile(0.95) === null ? 'n/a' : percentile(0.95).toFixed(1) + 's'],
                ['Cleanup verification', process.env.CLEANUP_RESULT || 'unknown'],
              ])
              .addDetails('Runner names', runners.length ? runners.join('\n') : 'No runner names observed.')
              .write();

            if (soak.length !== expected) {
              core.setFailed(`Observed ${soak.length} soak jobs; expected ${expected}.`);
            } else if (failed.length) {
              core.setFailed(`${failed.length} soak jobs did not complete successfully.`);
            } else if (process.env.CLEANUP_RESULT === 'failure') {
              core.setFailed('RunnerHub cleanup verification failed.');
            }
