name: publish-images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.dockerignore'
      - '.github/workflows/publish-images.yml'
      - 'deploy/docker/**'
      - 'deploy/truenas/check-images.sh'
      - 'deploy/truenas/verify-image-set.sh'
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'scaleset/**'
      - 'scripts/validate-release-local.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Run full release validation
        run: bash scripts/validate-release-local.sh --full

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: control
            image: runnerhub-control
          - target: agent
            image: runnerhub-agent
          - target: bootstrap
            image: runnerhub-bootstrap
          - target: scaleset
            image: runnerhub-scaleset
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eutelic/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

  promote-latest:
    name: Promote coherent latest set
    needs: publish
    # Only the default branch may advance the deployment-facing :latest set.
    # Tags and manual non-main runs keep their immutable/version tags only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote all images from the same commit
        env:
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for image in runnerhub-control runnerhub-agent runnerhub-bootstrap runnerhub-scaleset; do
            docker buildx imagetools create \
              --tag "ghcr.io/eutelic/${image}:latest" \
              "ghcr.io/eutelic/${image}:${SOURCE_TAG}"
          done

      - name: Verify promoted image set
        env:
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          bash deploy/truenas/check-images.sh --tag "$SOURCE_TAG"
          bash deploy/truenas/check-images.sh --tag latest
          bash deploy/truenas/verify-image-set.sh \
            --source-tag "$SOURCE_TAG" \
            --target-tag latest
