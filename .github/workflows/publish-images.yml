name: publish-images
run-name: RunnerHub publish ${{ inputs.request_id || github.sha }}

on:
  # CI still runs on main merges; publishing is an explicit operation.
  # Tags are another deliberate, versioned release action.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      request_id:
        description: "Optional opaque request ID for Dev Control Plane publish tracking"
        type: string
        required: false
      redeploy_runnerhub:
        description: "Drain RunnerHub CI and redeploy the control image after publishing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  packages: write

# A requested publication is deliberate and should finish without being
# cancelled by a subsequent merge or another publish request.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

# All publication jobs use RunnerHub. Out-of-band outage recovery is tracked
# separately; no workflow redirects to GitHub-hosted runners.
# Docker-capable build/validation work uses an isolated DinD lane. Registry tag
# publication is a daemonless crane operation on runnerhub-fast.
# Distinct live JIT acceptance remains part of publication; ordinary source and deployment validation lives in CI.
jobs:
  acceptance-config:
    name: Verify live JIT acceptance configuration
    runs-on: runnerhub
    timeout-minutes: 5
    steps:
      - name: Require dedicated GitHub App acceptance credentials
        env:
          APP_ISSUER: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER }}
          APP_PRIVATE_KEY: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$APP_ISSUER" =~ ^[0-9]+$ ]] || { echo "RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER must be the numeric GitHub App ID" >&2; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "Missing RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY" >&2; exit 1; }

  acceptance-host:
    name: Provision real JIT acceptance runner
    needs: acceptance-config
    runs-on: runnerhub-publisher
    timeout-minutes: 15
    env:
      RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER }}
      RUNNERHUB_ACCEPTANCE_REPOSITORY: ${{ github.repository }}
      RUNNERHUB_ACCEPTANCE_RUNNER_IMAGE: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Materialize acceptance GitHub App key
        env:
          APP_PRIVATE_KEY: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/runnerhub-acceptance-app.pem"
          test -s "$RUNNER_TEMP/runnerhub-acceptance-app.pem"

      - name: Run real JIT lifecycle host
        env:
          RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY_FILE: ${{ runner.temp }}/runnerhub-acceptance-app.pem
          RUNNERHUB_ACCEPTANCE_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/jit-acceptance-host.sh

  jit-smoke:
    name: Execute real JIT acceptance job
    needs: acceptance-config
    runs-on: runnerhub-release-acceptance
    timeout-minutes: 12
    steps:
      - name: Prove job execution
        run: |
          set -euo pipefail
          echo "RunnerHub real JIT acceptance job started"
          uname -a
          sleep 30
          echo "RunnerHub real JIT acceptance job completed"

  publish:
    needs: [acceptance-host, jit-smoke]
    runs-on: runnerhub-publisher
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      # A DinD runner without verified aggregate cgroup containment reserves
      # 2x its configured CPU. Keep publisher builds from consuming all of the
      # compute host's scheduler capacity, leaving room for CI validation.
      max-parallel: 2
      matrix:
        include:
          - target: control
            image: runnerhub-control
          - target: agent
            image: runnerhub-agent
          - target: bootstrap
            image: runnerhub-bootstrap
          - target: scaleset
            image: runnerhub-scaleset
          - target: deployer
            image: runnerhub-deployer
          - target: updater
            image: runnerhub-agent-updater
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/eutelic/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Build and stage ${{ matrix.target }}
        id: build
        # GitHub Actions artifacts are at quota; retain the job summary
        # without uploading Docker build-record archives.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

      - name: Record staged build evidence
        env:
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Staged OCI build evidence"
            printf '%s\n' "- target: $TARGET" "- platforms: linux/amd64,linux/arm64" \
              "- build arg: VERSION=$GITHUB_SHA" "- digest: $DIGEST" \
              "- BuildKit provenance: enabled" "- SBOM: enabled"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub's actions/attest API is unavailable for this private
      # organization/repository billing tier. Sigstore keyless Cosign uses
      # the existing GitHub Actions OIDC token and publishes a verifiable OCI
      # signature directly to GHCR, without GitHub's attestation storage API.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and verify published image with GitHub OIDC
        env:
          IMAGE: ghcr.io/eutelic/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          ref="$IMAGE@$DIGEST"
          identity="https://github.com/eutelic/runnerhub/.github/workflows/publish-images.yml@$GITHUB_REF"
          cosign sign --yes --annotations "source-sha=$SOURCE_SHA" "$ref"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "eutelic/runnerhub" \
            --certificate-github-workflow-sha "$SOURCE_SHA" \
            --annotations "source-sha=$SOURCE_SHA" \
            "$ref" >/dev/null
          echo "[ok] keyless GHCR signature verified for $ref"

  verify-staged-images:
    name: Verify staged published artifacts
    needs: publish
    runs-on: runnerhub-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify multi-architecture staged image set
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: bash deploy/truenas/check-images.sh --tag "$IMAGE_TAG"
      - name: Exercise persisted control-data migration on staged artifact
        env:
          CONTROL_IMAGE: ghcr.io/eutelic/runnerhub-control:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$CONTROL_IMAGE"
          bash deploy/docker/test-control-data-ownership.sh "$CONTROL_IMAGE"

  publish-tags:
    name: Publish image tags with crane
    needs: verify-staged-images
    # Registry-only publication does not need Docker. Run it on the explicitly
    # fast compute lane; the build matrix can move here too once runnerhub-fast
    # is configured as a Docker-capable custom profile.
    runs-on: runnerhub-fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
          cache: false

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      - name: Publish and verify image tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: sha-${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          printf '%s' "$GITHUB_TOKEN" | "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          short_tag="sha-${GITHUB_SHA:0:7}"
          publish_latest=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ "$remote_main" = "$GITHUB_SHA" ]; then
              publish_latest=true
            else
              echo "[note] main advanced to $remote_main; refusing to move latest from stale $GITHUB_SHA"
            fi
          fi

          for image in runnerhub-control runnerhub-agent runnerhub-bootstrap runnerhub-scaleset runnerhub-deployer runnerhub-agent-updater; do
            ref="ghcr.io/eutelic/${image}"
            source="${ref}:${SOURCE_TAG}"
            source_digest="$("$crane" digest "$source")"

            "$crane" tag "$source" "$short_tag"
            test "$("$crane" digest "${ref}:${short_tag}")" = "$source_digest"

            if [ "$REF_TYPE" = "tag" ]; then
              "$crane" tag "$source" "$REF_NAME"
              test "$("$crane" digest "${ref}:${REF_NAME}")" = "$source_digest"
            fi

            if [ "$publish_latest" = "true" ]; then
              "$crane" tag "$source" latest
              test "$("$crane" digest "${ref}:latest")" = "$source_digest"
            fi

            echo "[ ok ] published aliases for ${ref} -> ${source_digest}"
          done
      # Request only after all five matching images have been published and
      # latest was promoted for the exact current main commit. The control
      # image digest is sent separately so TrueNAS deploys this exact artifact.
      # Manual dispatch defaults to publish-only; redeployment requires opting in.
      # This job itself must finish before the external deployer drains CI.
      - name: Request coordinated RunnerHub self-redeployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.redeploy_runnerhub
        env:
          RUNNERHUB_DEPLOY_TOKEN: ${{ secrets.RUNNERHUB_DEPLOY_TOKEN }}
          RUNNERHUB_DEPLOY_URL: ${{ vars.RUNNERHUB_DEPLOY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RUNNERHUB_DEPLOY_TOKEN:-}" ] || [ -z "${RUNNERHUB_DEPLOY_URL:-}" ]; then
            echo '[error] RunnerHub deployer credentials are missing for an explicitly requested self-redeployment' >&2
            exit 1
          fi
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo '[note] main advanced; not requesting redeploy of an obsolete image set'
            exit 0
          fi
          deploy_url="${RUNNERHUB_DEPLOY_URL%/}/api/v1/deployments/runnerhub"
          # Old deployers use synchronous pull/redeploy. Fail closed rather
          # than terminating the currently running publishing job.
          if ! capabilities="$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $RUNNERHUB_DEPLOY_TOKEN" \
            "$deploy_url/capabilities")"; then
            echo "[error] redeployer is unavailable or too old for safe CI drain; upgrade the standalone deployer first"
            exit 1
          fi
          if ! printf '%s' "$capabilities" | grep -qE '"async_self_redeploy"[[:space:]]*:[[:space:]]*true'; then
            echo "[error] redeployer does not advertise asynchronous RunnerHub self-redeployment"
            exit 1
          fi
          crane="$(go env GOPATH)/bin/crane"
          image_digest="$("$crane" digest "ghcr.io/eutelic/runnerhub-control:sha-${GITHUB_SHA}")"
          if ! [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "[error] published RunnerHub control image has an invalid digest: $image_digest"
            exit 1
          fi
          payload="$(printf '{"sha":"%s","run_id":"%s","image_digest":"%s"}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$image_digest")"
          # The deployer returns 202 immediately. It waits for this and all
          # other CI jobs to finish before calling TrueNAS.
          curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST "$deploy_url" \
            --header "Authorization: Bearer $RUNNERHUB_DEPLOY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload"
      - name: Verify release tags are anonymously pullable
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_docker_config"' EXIT
          for image in runnerhub-control runnerhub-agent runnerhub-bootstrap runnerhub-scaleset runnerhub-deployer runnerhub-agent-updater; do
            ref="ghcr.io/eutelic/${image}:${REF_NAME}"
            digest="$(DOCKER_CONFIG="$anonymous_docker_config" "$crane" digest "$ref")"
            test -n "$digest"
            echo "[ ok ] anonymous pull metadata available for ${ref} -> ${digest}"
          done

  github-release:
    name: Create GitHub release after anonymous image verification
    if: github.ref_type == 'tag'
    needs: publish-tags
    runs-on: runnerhub-fast
    permissions:
      contents: write
    steps:
      - name: Create versioned release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tags must use vX.Y.Z[-prerelease]" >&2
            exit 1
          }
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          status="$(curl -sS -o "$RUNNER_TEMP/release-check.json" -w '%{http_code}' \
            -H "$auth_header" -H 'Accept: application/vnd.github+json' \
            "$api/tags/$GITHUB_REF_NAME")"
          if [ "$status" = "200" ]; then
            echo "[ ok ] release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          test "$status" = "404" || { echo "GitHub release lookup failed: HTTP $status" >&2; exit 1; }
          payload="$(printf '{"tag_name":"%s","name":"%s","generate_release_notes":true}' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME")"
          curl --fail-with-body --show-error --silent \
            -X POST -H "$auth_header" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' --data "$payload" "$api" > /dev/null
          echo "[ ok ] created GitHub release $GITHUB_REF_NAME"
