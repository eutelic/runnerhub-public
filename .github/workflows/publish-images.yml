name: publish-images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.dockerignore'
      - '.github/workflows/publish-images.yml'
      - 'deploy/docker/**'
      - 'deploy/truenas/check-images.sh'
      - 'deploy/truenas/verify-image-set.sh'
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'scaleset/**'
      - 'scripts/validate-release-local.sh'
      - 'scripts/jit-acceptance-host.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-config:
    name: Verify live JIT acceptance configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require dedicated GitHub App acceptance credentials
        env:
          APP_ISSUER: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER }}
          APP_PRIVATE_KEY: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$APP_ISSUER" =~ ^[0-9]+$ ]] || { echo "RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER must be the numeric GitHub App ID" >&2; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "Missing RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY" >&2; exit 1; }

  acceptance-host:
    name: Provision real JIT acceptance runner
    needs: acceptance-config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER }}
      RUNNERHUB_ACCEPTANCE_REPOSITORY: ${{ github.repository }}
      RUNNERHUB_ACCEPTANCE_RUNNER_IMAGE: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Materialize acceptance GitHub App key
        env:
          APP_PRIVATE_KEY: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/runnerhub-acceptance-app.pem"
          test -s "$RUNNER_TEMP/runnerhub-acceptance-app.pem"

      - name: Run real JIT lifecycle host
        env:
          RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY_FILE: ${{ runner.temp }}/runnerhub-acceptance-app.pem
          RUNNERHUB_ACCEPTANCE_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/jit-acceptance-host.sh

  jit-smoke:
    name: Execute real JIT acceptance job
    needs: acceptance-config
    runs-on: runnerhub-release-acceptance
    timeout-minutes: 12
    steps:
      - name: Prove job execution
        run: |
          set -euo pipefail
          echo "RunnerHub real JIT acceptance job started"
          uname -a
          sleep 30
          echo "RunnerHub real JIT acceptance job completed"

  verify-release:
    name: Validate release candidate
    needs: [acceptance-host, jit-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Run full release validation
        run: bash scripts/validate-release-local.sh --full

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: control
            image: runnerhub-control
          - target: agent
            image: runnerhub-agent
          - target: bootstrap
            image: runnerhub-bootstrap
          - target: scaleset
            image: runnerhub-scaleset
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eutelic/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

  promote-latest:
    name: Promote coherent latest set
    needs: publish
    # Only the default branch may advance the deployment-facing :latest set.
    # Tags and manual non-main runs keep their immutable/version tags only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote all images from the same commit
        env:
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for image in runnerhub-control runnerhub-agent runnerhub-bootstrap runnerhub-scaleset; do
            docker buildx imagetools create \
              --tag "ghcr.io/eutelic/${image}:latest" \
              "ghcr.io/eutelic/${image}:${SOURCE_TAG}"
          done

      - name: Verify promoted image set
        env:
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          bash deploy/truenas/check-images.sh --tag "$SOURCE_TAG"
          bash deploy/truenas/check-images.sh --tag latest
          bash deploy/truenas/verify-image-set.sh \
            --source-tag "$SOURCE_TAG" \
            --target-tag latest
