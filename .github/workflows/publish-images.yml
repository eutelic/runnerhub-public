name: publish-images

on:
  # CI still runs on main merges; publishing is an explicit operation.
  # Tags are another deliberate, versioned release action.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

# A requested publication is deliberate and should finish without being
# cancelled by a subsequent merge or another publish request.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

# All publication jobs use RunnerHub. Out-of-band outage recovery is tracked
# separately; no workflow redirects to GitHub-hosted runners.
# Docker-capable build/validation work uses an isolated DinD lane. Registry tag
# publication is a daemonless crane operation on runnerhub-fast.
# Distinct live JIT acceptance remains part of publication; ordinary source and deployment validation lives in CI.
jobs:
  acceptance-config:
    name: Verify live JIT acceptance configuration
    runs-on: runnerhub
    timeout-minutes: 5
    steps:
      - name: Require dedicated GitHub App acceptance credentials
        env:
          APP_ISSUER: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER }}
          APP_PRIVATE_KEY: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$APP_ISSUER" =~ ^[0-9]+$ ]] || { echo "RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER must be the numeric GitHub App ID" >&2; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "Missing RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY" >&2; exit 1; }

  acceptance-host:
    name: Provision real JIT acceptance runner
    needs: acceptance-config
    runs-on: runnerhub-publisher
    timeout-minutes: 15
    env:
      RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_ISSUER }}
      RUNNERHUB_ACCEPTANCE_REPOSITORY: ${{ github.repository }}
      RUNNERHUB_ACCEPTANCE_RUNNER_IMAGE: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache: true

      - name: Materialize acceptance GitHub App key
        env:
          APP_PRIVATE_KEY: ${{ secrets.RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/runnerhub-acceptance-app.pem"
          test -s "$RUNNER_TEMP/runnerhub-acceptance-app.pem"

      - name: Run real JIT lifecycle host
        env:
          RUNNERHUB_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY_FILE: ${{ runner.temp }}/runnerhub-acceptance-app.pem
          RUNNERHUB_ACCEPTANCE_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/jit-acceptance-host.sh

  jit-smoke:
    name: Execute real JIT acceptance job
    needs: acceptance-config
    runs-on: runnerhub-release-acceptance
    timeout-minutes: 12
    steps:
      - name: Prove job execution
        run: |
          set -euo pipefail
          echo "RunnerHub real JIT acceptance job started"
          uname -a
          sleep 30
          echo "RunnerHub real JIT acceptance job completed"

  publish:
    needs: [acceptance-host, jit-smoke]
    runs-on: runnerhub-publisher
    strategy:
      fail-fast: false
      # A DinD runner without verified aggregate cgroup containment reserves
      # 2x its configured CPU. Keep publisher builds from consuming all of the
      # compute host's scheduler capacity, leaving room for CI validation.
      max-parallel: 2
      matrix:
        include:
          - target: control
            image: runnerhub-control
          - target: agent
            image: runnerhub-agent
          - target: bootstrap
            image: runnerhub-bootstrap
          - target: scaleset
            image: runnerhub-scaleset
          - target: deployer
            image: runnerhub-deployer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/eutelic/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Build and stage ${{ matrix.target }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

      - name: Record staged build evidence
        env:
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Staged OCI build evidence"
            echo "- target: `$TARGET`"
            echo "- platforms: `linux/amd64,linux/arm64`"
            echo "- build arg: `VERSION=$GITHUB_SHA`"
            echo "- digest: `$DIGEST`"
            echo "- provenance: enabled"
            echo "- SBOM: enabled"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-staged-images:
    name: Verify staged published artifacts
    needs: publish
    runs-on: runnerhub-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify multi-architecture staged image set
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: bash deploy/truenas/check-images.sh --tag "$IMAGE_TAG"
      - name: Exercise persisted control-data migration on staged artifact
        env:
          CONTROL_IMAGE: ghcr.io/eutelic/runnerhub-control:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$CONTROL_IMAGE"
          bash deploy/docker/test-control-data-ownership.sh "$CONTROL_IMAGE"

  publish-tags:
    name: Publish image tags with crane
    needs: verify-staged-images
    # Registry-only publication does not need Docker. Run it on the explicitly
    # fast compute lane; the build matrix can move here too once runnerhub-fast
    # is configured as a Docker-capable custom profile.
    runs-on: runnerhub-fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      - name: Publish and verify image tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: sha-${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          printf '%s' "$GITHUB_TOKEN" | "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          short_tag="sha-${GITHUB_SHA:0:7}"
          publish_latest=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ "$remote_main" = "$GITHUB_SHA" ]; then
              publish_latest=true
            else
              echo "[note] main advanced to $remote_main; refusing to move latest from stale $GITHUB_SHA"
            fi
          fi

          for image in runnerhub-control runnerhub-agent runnerhub-bootstrap runnerhub-scaleset runnerhub-deployer; do
            ref="ghcr.io/eutelic/${image}"
            source="${ref}:${SOURCE_TAG}"
            source_digest="$("$crane" digest "$source")"

            "$crane" tag "$source" "$short_tag"
            test "$("$crane" digest "${ref}:${short_tag}")" = "$source_digest"

            if [ "$REF_TYPE" = "tag" ]; then
              "$crane" tag "$source" "$REF_NAME"
              test "$("$crane" digest "${ref}:${REF_NAME}")" = "$source_digest"
            fi

            if [ "$publish_latest" = "true" ]; then
              "$crane" tag "$source" latest
              test "$("$crane" digest "${ref}:latest")" = "$source_digest"
            fi

            echo "[ ok ] published aliases for ${ref} -> ${source_digest}"
          done
      - name: Verify release tags are anonymously pullable
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crane="$(go env GOPATH)/bin/crane"
          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_docker_config"' EXIT
          for image in runnerhub-control runnerhub-agent runnerhub-bootstrap runnerhub-scaleset runnerhub-deployer; do
            ref="ghcr.io/eutelic/${image}:${REF_NAME}"
            digest="$(DOCKER_CONFIG="$anonymous_docker_config" "$crane" digest "$ref")"
            test -n "$digest"
            echo "[ ok ] anonymous pull metadata available for ${ref} -> ${digest}"
          done

  github-release:
    name: Create GitHub release after anonymous image verification
    if: github.ref_type == 'tag'
    needs: publish-tags
    runs-on: runnerhub-fast
    permissions:
      contents: write
    steps:
      - name: Create versioned release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tags must use vX.Y.Z[-prerelease]" >&2
            exit 1
          }
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          status="$(curl -sS -o "$RUNNER_TEMP/release-check.json" -w '%{http_code}' \
            -H "$auth_header" -H 'Accept: application/vnd.github+json' \
            "$api/tags/$GITHUB_REF_NAME")"
          if [ "$status" = "200" ]; then
            echo "[ ok ] release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          test "$status" = "404" || { echo "GitHub release lookup failed: HTTP $status" >&2; exit 1; }
          payload="$(printf '{"tag_name":"%s","name":"%s","generate_release_notes":true}' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME")"
          curl --fail-with-body --show-error --silent \
            -X POST -H "$auth_header" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' --data "$payload" "$api" > /dev/null
          echo "[ ok ] created GitHub release $GITHUB_REF_NAME"
